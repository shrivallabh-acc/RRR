sources:
  brain:
    dir: "./brain"
    value_stream: "OSM"
  environment:  { type: file, path: "./data/environment.json" }
  dependency:   { type: file, path: "./data/dependency.json" }
  operability:  { type: file, path: "./data/operability.json" }   # ADR-0016 item 7
  # Observability, Rollback, Security, Performance are opt-in — uncomment to enable:
  # observability: { type: file, path: "./data/observability.json" }
  # rollback:      { type: file, path: "./data/rollback.json" }
  # security:      { type: file, path: "./data/security.json" }
  # Live API form — swap the above file lines for these once endpoints are available:
  #   environment: { type: api, url: "http://127.0.0.1:8001/environment" }
  #   dependency:  { type: api, url: "http://127.0.0.1:8002/dependency" }
  #   operability: { type: api, url: "http://127.0.0.1:8003/operability" }
  allowed_hosts: ["127.0.0.1", "localhost"]

thresholds:
  required_dimensions: [test_readiness]

memory:
  chroma_path: "./data/local/chroma"

# Value-stream alias registry — maps all programme names and abbreviations used
# across releases, tools, and dependency annotations so the Trends tab can
# correctly classify every release as Direct / Dependency / Supporting / Other.
value_stream:
  canonical: "OSM"
  aliases:
    - "OSM"
    - "OS&M"
    - "Offer Selection & Management"
    - "Offer Selection and Management"
  # AIMS, EIMS, PIMS are shared-platform programmes; their releases support OSM
  # features and appear in the "Supporting" category of the Trends filter.
  related_programmes:
    - "AIMS"
    - "EIMS"
    - "PIMS"
