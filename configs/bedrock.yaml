# configs/bedrock.yaml — OSM value stream, Amazon Bedrock LLM narrative (ADR-0019)
#
# Uses the AWS credentials already present in your environment (IAM role, aws configure,
# or the AWS SSO token from your Kiro IDE session).
#
# Usage:
#   rrr --release "RetirePlus RC/RCP Enrollment" --config configs/bedrock.yaml
#
# Prerequisites:
#   pip install rrr[bedrock]
#   aws configure  (or ensure your SSO token is active)

provider:
  type: bedrock
  repair_retries: 1          # one repair attempt before falling back to rule_based
  bedrock:
    model_id: "anthropic.claude-3-5-sonnet-20241022-v2:0"
    region: "us-east-1"     # change to the region where your model access is enabled
    max_tokens: 1024
    temperature: 0.1         # low temperature for structured JSON output

sources:
  brain:
    dir: "./brain"
    value_stream: "OSM"
  environment: { type: file, path: "./data/environment.json" }
  dependency:  { type: file, path: "./data/dependency.json" }

thresholds:
  required_dimensions: [test_readiness]
