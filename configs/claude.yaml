# configs/claude.yaml — OSM value stream, Anthropic Claude LLM narrative (ADR-0006)
#
# Uses the ANTHROPIC_API_KEY environment variable for authentication.
# The API key must NOT be placed in this file — pass it via the environment.
#
# Usage:
#   export ANTHROPIC_API_KEY=sk-ant-...
#   rrr --release "RetirePlus RC/RCP Enrollment" --config configs/claude.yaml
#
# Prerequisites:
#   pip install rrr[cloud]

provider:
  type: claude
  repair_retries: 1          # one repair attempt before falling back to rule_based
  claude:
    model: "claude-sonnet-4-6"  # lower cost than opus; still high quality for structured output
    max_tokens: 1024
    temperature: 0.1            # low temperature for structured JSON output

sources:
  brain:
    dir: "./brain"
    value_stream: "OSM"
  environment: { type: file, path: "./data/environment.json" }
  dependency:  { type: file, path: "./data/dependency.json" }

thresholds:
  required_dimensions: [test_readiness]
